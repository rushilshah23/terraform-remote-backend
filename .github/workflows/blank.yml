name: Terraform Infrastructure CI/CD

on:

  pull_request:
    branches:
      - sandbox
      - production

  push:
    branches:
      - sandbox
      - production

permissions:
  id-token: write
  contents: read

jobs:

  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

    env:
      TF_VAR_bucket_name: ${{ vars.TF_VAR_bucket_name }}
      TF_VAR_dynamodb_table_name: ${{ vars.TF_VAR_dynamodb_table_name }}
      TF_VAR_hash_key: ${{ secrets.TF_VAR_hash_key }}
      TF_VAR_enviornment: ${{ vars.TF_VAR_enviornment }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::565393071767:role/GIthuActions-CICD-RemoteInfra
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Set Environment Directory
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ENV_NAME=${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "ENV_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        working-directory: environments/${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: environments/${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: terraform plan

  terraform-apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    needs: terraform-plan

    if: github.event_name == 'push'

    environment: ${{ github.ref_name }}

    env:
      TF_VAR_bucket_name: ${{ vars.TF_VAR_bucket_name }}
      TF_VAR_dynamodb_table_name: ${{ vars.TF_VAR_dynamodb_table_name }}
      TF_VAR_hash_key: ${{ secrets.TF_VAR_hash_key }}
      TF_VAR_enviornment: ${{ vars.TF_VAR_enviornment }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::565393071767:role/GIthuActions-CICD-RemoteInfra
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: environments/${{ github.ref_name }}
        run: terraform init

      - name: Terraform Apply
        if: github.ref_name == 'sandbox' || github.ref_name == 'production'
        working-directory: environments/${{ github.ref_name }}
        run: terraform apply -auto-approve